baseURL = "https://www.qrlecosystem.com/"
enableRobotsTXT = true
locale = "en-us"
title = "QRL Ecosystem Index"
theme = []

[outputFormats.markdown]
baseName = "index.html"
permalinkable = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true
root = true

[outputs]
home = ["html", "rss", "markdown", "llms"]
page = ["html", "markdown"]
section = ["html", "rss", "markdown"]
taxonomy = ["html", "rss", "markdown"]
term = ["html", "rss", "markdown"]

[params]
description = "A community-contributed index of projects across QRL 1.x and QRL 2.0"
openGraphDefaultImage = "/images/og/default.png"

[taxonomies]
category = "categories"
capability = "capabilities"
maintainer = "maintainers"
publisher = "publishers"
project_type = "project-types"

[markup.goldmark.renderer]
unsafe = false

[build]
publishDir = "public"

[menu]
[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 1
