features:
  - Every wallet drawn as a bubble sized by balance and linked by transfers
  - Wallets that trade with each other packed into clusters
  - Search by Q-address or qrl-nicknames nickname
  - Fund tracing, counterparties and balance-over-time per wallet
  - Time period picker with playback
  - Exchange and entity labels from the Quantascan directory

